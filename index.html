<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Your Name</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Publications
    </div>

    <nav>

        <a href="#">Home</a>
        <a href="#publications">Articles</a>

        <button id="themeToggle">
            <i class="fa-solid fa-moon"></i>
        </button>

    </nav>

</header>

<section class="hero">

    <h1>
        A collection of articles,
        essays & research writing.
    </h1>

    <p>
        Exploring healthcare, biology, artificial intelligence,
        technology and ideas through published work.
    </p>

</section>

<section class="search">

    <input
        type="text"
        id="searchInput"
        placeholder="Search publications...">

</section>

<section
    id="publications"
    class="publication-grid">

    <!-- JavaScript will automatically insert cards here -->

</section>

<footer>

    <p>
        © 2026 Your Name
    </p>

</footer>

<script src="js/app.js"></script>

</body>
</html>
